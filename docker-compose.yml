services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3008}
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3008}
      APP_URL: ${APP_URL:-http://localhost:3008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3008}

  # Template for your project — this starter app does not connect to it.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
